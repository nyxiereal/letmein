name: Build release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing files
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$KEY_PROPERTIES"
          test -n "$SIGNING_KEY"
          printf '%s' "$KEY_PROPERTIES" > key.properties
          printf '\nstoreFile=release.keystore\n' >> key.properties
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: mbank-unrestrictor-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
